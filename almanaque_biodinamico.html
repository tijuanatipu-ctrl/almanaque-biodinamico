<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Almanaque">
<meta name="theme-color" content="#cc0000">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<title>Almanaque Biodinámico · El Huerto de Lucas</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }

/* ── VARIABLES CLARO / OSCURO ── */
:root {
  --bg-page:    #e8e8e8;
  --bg-card:    #ffffff;
  --bd-card:    #1a1a1a;
  --bg-hdr:     #1a1a1a;
  --bg-nav:     #cc0000;
  --bg-moon:    #f4f4f4;
  --bd-moon:    rgba(0,0,0,.07);
  --bg-cal:     #f9f9f9;
  --bd-cal:     rgba(0,0,0,.1);
  --bg-ftr:     #1a1a1a;
  --c-primary:  #1a1a1a;
  --c-secondary:#444444;
  --c-muted:    #999999;
  --c-dim:      #cccccc;
  --c-accent:   #cc0000;
  --c-divider:  rgba(0,0,0,.15);
  --c-tip:      #333333;
  --c-tipline:  #e0e0e0;
  --c-picked-bg:#1a1a1a;
  --c-picked-fg:#ffffff;
  --shadow:     0 8px 40px rgba(0,0,0,.2);
}
body.dark {
  --bg-page:    #111111;
  --bg-card:    #1c1c1e;
  --bd-card:    #3a3a3a;
  --bg-hdr:     #0d0d0d;
  --bg-nav:     #8b0000;
  --bg-moon:    #272729;
  --bd-moon:    rgba(255,255,255,.07);
  --bg-cal:     #222224;
  --bd-cal:     rgba(255,255,255,.08);
  --bg-ftr:     #0d0d0d;
  --c-primary:  #e8e8e8;
  --c-secondary:#aaaaaa;
  --c-muted:    #555555;
  --c-dim:      #3a3a3a;
  --c-accent:   #e03030;
  --c-divider:  rgba(255,255,255,.1);
  --c-tip:      #9a9a9a;
  --c-tipline:  #2a2a2a;
  --c-picked-bg:#e8e8e8;
  --c-picked-fg:#1a1a1a;
  --shadow:     0 8px 40px rgba(0,0,0,.6);
}

body {
  min-height:100vh;
  background:var(--bg-page);
  display:flex; flex-direction:column; align-items:center;
  padding:20px 0 36px;
  font-family:'Georgia','Times New Roman',serif;
  user-select:none;
  transition:background .3s;
}

/* ── CARD ── */
#card {
  width:min(100vw, 420px);
  background:var(--bg-card);
  display:flex; flex-direction:column;
  box-shadow:var(--shadow);
  overflow:hidden; position:relative;
  border-left:1.5px solid var(--bd-card);
  border-right:1.5px solid var(--bd-card);
  border-bottom:1.5px solid var(--bd-card);
  transition:background .3s, border-color .3s;
}
#card::before {
  content:''; position:absolute;
  top:0; left:0; right:0; height:3px;
  background:var(--c-accent); z-index:10;
}

/* HEADER */
.hdr {
  background:var(--bg-hdr);
  padding:12px 18px 11px;
  display:flex; align-items:center; justify-content:space-between;
  flex-shrink:0; margin-top:3px;
  transition:background .3s;
}
.hdr-name   { color:#fff; font-size:clamp(10px,2.9vw,12px); font-weight:bold; letter-spacing:2px; text-transform:uppercase; }
.hdr-sub    { color:rgba(255,255,255,.38); font-size:clamp(7px,2vw,8.5px); letter-spacing:.8px; margin-top:2px; }
.hdr-right  { display:flex; align-items:center; gap:8px; }
.hdr-icon   { font-size:clamp(18px,5.5vw,24px); }
.hdr-season { color:#fff; font-size:clamp(9px,2.6vw,11px); letter-spacing:.5px; text-align:right; line-height:1.5; }
.hdr-season span { color:rgba(255,255,255,.4); font-size:clamp(6px,1.9vw,8px); }

/* MONTH NAV */
.month-nav {
  display:flex; align-items:center; justify-content:space-between;
  padding:7px 14px; background:var(--bg-nav); flex-shrink:0;
  transition:background .3s;
}
.mnav-btn {
  background:none; border:none; color:#fff; font-size:22px;
  cursor:pointer; padding:0 10px; opacity:.85; line-height:1;
  -webkit-tap-highlight-color:transparent;
}
.mnav-btn:active { opacity:.5; }
.mnav-label { color:#fff; font-size:clamp(10px,3.1vw,13px); font-weight:bold; letter-spacing:3px; text-transform:uppercase; }

/* DATE */
.date-wrap { text-align:center; padding:14px 18px 4px; flex-shrink:0; }
.day-name { font-size:clamp(9px,2.6vw,11px); font-weight:bold; color:var(--c-muted); letter-spacing:5px; text-transform:uppercase; }
.date-num { font-size:clamp(64px,22vw,96px); font-weight:900; color:var(--c-accent); line-height:.88; font-family:'Arial Black','Arial',sans-serif; }

/* DIVIDERS */
.div-line {
  height:1px;
  background:linear-gradient(to right,transparent,var(--c-divider),transparent);
  margin:8px 22px; flex-shrink:0;
}

/* BIO TYPE */
.bio-wrap {
  display:flex; align-items:center; justify-content:center;
  gap:10px; padding:8px 18px 4px; flex-shrink:0;
}
.bio-icon { font-size:clamp(22px,7vw,30px); line-height:1; }
.bio-lbl  { font-size:clamp(12px,3.8vw,16px); font-weight:bold; letter-spacing:2px; text-transform:uppercase; color:var(--c-primary); }

/* MOON */
.moon-wrap {
  display:flex; align-items:center; gap:12px;
  padding:9px 14px; margin:2px 16px;
  border-radius:8px; background:var(--bg-moon);
  flex-shrink:0; border:1px solid var(--bd-moon);
  transition:background .3s, border-color .3s;
}
.moon-em  { font-size:24px; }
.moon-txt { font-size:12px; color:var(--c-secondary); line-height:1.65; }
.moon-sign{ font-weight:bold; color:var(--c-primary); }

/* WINDOW */
.win-wrap { text-align:center; padding:5px 18px 2px; flex-shrink:0; }
.win-lbl  { font-size:8px; color:var(--c-muted); letter-spacing:2px; text-transform:uppercase; margin-bottom:2px; }
.win-val  { font-size:13px; font-weight:bold; color:var(--c-accent); }

/* SEASONAL CROPS */
.crops-wrap { padding:4px 18px 6px; flex-shrink:0; }
.crop-row   { display:flex; align-items:baseline; gap:8px; margin-bottom:6px; }
.crop-em    { font-size:14px; flex-shrink:0; }
.crop-lbl   { font-size:9px; color:var(--c-muted); letter-spacing:1.5px; text-transform:uppercase; flex-shrink:0; min-width:58px; }
.crop-val   { font-size:12px; color:var(--c-primary); font-style:italic; line-height:1.5; }

.crop-link {
  cursor:pointer; color:var(--c-primary);
  border-bottom:1px dotted var(--c-accent);
  font-style:italic; transition:color .15s;
}
.crop-link:hover { color:var(--c-accent); }

/* TIP */
.tip-wrap { padding:4px 18px 10px; flex-shrink:0; }
.tip-ttl  {
  font-size:8px; color:var(--c-muted); letter-spacing:2px; text-transform:uppercase;
  margin-bottom:5px; display:flex; align-items:center; gap:7px;
}
.tip-ttl::after { content:''; flex:1; height:1px; background:var(--c-tipline); }
.tip-body { font-size:12.5px; color:var(--c-tip); line-height:1.65; font-style:italic; }

/* MINI CALENDAR */
.cal-wrap {
  margin:2px 16px 10px;
  border:1px solid var(--bd-cal); border-radius:8px;
  padding:7px 10px; background:var(--bg-cal); flex-shrink:0;
  transition:background .3s, border-color .3s;
}
.cal-ttl { font-size:8px; color:var(--c-muted); letter-spacing:2px; text-transform:uppercase; text-align:center; margin-bottom:4px; }
.cal-tbl { width:100%; border-collapse:collapse; }
.cal-tbl th{ font-size:9px; color:var(--c-muted); text-align:center; padding:2px 0; font-weight:normal; }
.cal-tbl td{ text-align:center; padding:2px 0; }
.dcell {
  display:inline-flex; align-items:center; justify-content:center;
  width:26px; height:22px; border-radius:5px;
  font-size:10px; color:var(--c-primary);
  cursor:pointer; transition:opacity .15s;
  -webkit-tap-highlight-color:transparent;
}
.dcell:active { opacity:.4; }
.dcell.today  { background:var(--c-accent); color:#fff; font-weight:bold; }
.dcell.picked { background:var(--c-picked-bg); color:var(--c-picked-fg); font-weight:bold; }

/* FOOTER */
.ftr {
  background:var(--bg-ftr);
  padding:9px 18px;
  display:flex; align-items:center; justify-content:space-between;
  flex-shrink:0; transition:background .3s;
}
.ftr-main { color:rgba(255,255,255,.72); font-size:9.5px; letter-spacing:.8px; }
.ftr-src  { color:rgba(255,255,255,.28); font-size:7px; letter-spacing:.5px; text-align:right; line-height:1.5; }

/* CONTROLS (below card) */
.controls {
  display:flex; gap:10px; margin-top:18px;
  justify-content:center; padding:0 16px; flex-wrap:wrap;
}

/* ══════════════════════════════════════════════════
   IG SCREENSHOT MODE — ?ig=1  (1000×1250 → 1080×1350)
   ══════════════════════════════════════════════════ */
body.ig-mode {
  padding:0 !important;
  background:#1a1a1a !important;
  min-height:100vh;
  justify-content:flex-start;
  --c-accent:    #ec008c;
  --c-primary:   #f0f0f0;
  --c-secondary: #cccccc;
  --c-muted:     #888888;
  --bg-nav:      #ec008c;
  --bg-hdr:      #0d0d0d;
  --bg-card:     #1a1a1a;
  --bd-card:     #1a1a1a;
  --bg-moon:     #252525;
  --bd-moon:     rgba(236,0,140,.2);
  --c-divider:   rgba(255,255,255,.1);
  --c-tip:       #aaaaaa;
  --c-tipline:   #333333;
}
body.ig-mode #card {
  width:100vw !important;
  max-width:100vw !important;
  min-height:100vh !important;
  box-shadow:none !important;
  border:none !important;
  display:flex; flex-direction:column;
  justify-content:space-between;
}
body.ig-mode .controls { display:none !important; }
body.ig-mode .cal-wrap  { display:none !important; }

/* — TIPOGRAFÍA IG — */
body.ig-mode { font-family:'Josefin Sans', sans-serif !important; }
body.ig-mode .date-num,
body.ig-mode .bio-lbl,
body.ig-mode .hdr-name,
body.ig-mode .mnav-label { font-family:'Cormorant Garamond', serif !important; }

/* — HEADER — */
body.ig-mode .hdr        { padding:1.6vw 6vw; }
body.ig-mode .hdr-name   { font-size:2.2vw; letter-spacing:.4vw; font-weight:300; }
body.ig-mode .hdr-sub    { font-size:1.2vw; margin-top:.2vw; }
body.ig-mode .hdr-season { font-size:2vw; line-height:1.5; font-family:'Josefin Sans',sans-serif; font-weight:300; letter-spacing:.2vw; }
body.ig-mode .hdr-icon   { font-size:3vw; }

/* — MONTH NAV — */
body.ig-mode .month-nav  { padding:2vw 6vw; }
body.ig-mode .mnav-label { font-size:3.6vw; letter-spacing:.8vw; font-weight:400; }
body.ig-mode .mnav-btn   { opacity:0; pointer-events:none; }

/* — DATE — */
body.ig-mode .date-wrap  { padding:1vw 6vw 0; }
body.ig-mode .day-name   { font-size:2.4vw; letter-spacing:1.4vw; font-weight:300; }
body.ig-mode .date-num   { font-size:28vw; line-height:.82; font-weight:700; }

/* — BIO TYPE (DÍA DE RAÍCES) — */
body.ig-mode .bio-wrap   { padding:2vw 6vw; gap:2vw; }
body.ig-mode .bio-icon   { font-size:6.5vw; }
body.ig-mode .bio-lbl    { font-size:4.8vw; letter-spacing:.5vw; font-weight:600; font-style:italic; }

/* — MOON — */
body.ig-mode .moon-wrap  { margin:0 5vw; padding:2.5vw 3.5vw; }
body.ig-mode .moon-em    { font-size:5.5vw; }
body.ig-mode .moon-txt   { font-size:2.6vw; line-height:1.65; font-weight:300; }
body.ig-mode .moon-sign  { font-size:3vw; font-family:'Cormorant Garamond',serif; font-style:italic; }

/* — PERÍODO FAVORABLE — */
body.ig-mode .win-wrap   { padding:1.5vw 6vw; }
body.ig-mode .win-lbl    { font-size:1.6vw; letter-spacing:.5vw; margin-bottom:.5vw; font-weight:300; }
body.ig-mode .win-val    { font-size:3.2vw; font-family:'Cormorant Garamond',serif; }

/* — SEMBRAR / COSECHAR — */
body.ig-mode .crops-wrap { padding:1.5vw 6vw; }
body.ig-mode .crop-row   { margin-bottom:1.5vw; gap:1.8vw; align-items:baseline; }
body.ig-mode .crop-em    { font-size:3.2vw; }
body.ig-mode .crop-lbl   { font-size:1.8vw; min-width:12vw; letter-spacing:.35vw; font-weight:300; }
body.ig-mode .crop-val   { font-size:2.8vw; line-height:1.5; font-family:'Cormorant Garamond',serif; font-style:italic; }

/* — TIP DEL DÍA — */
body.ig-mode .tip-wrap   { padding:1.5vw 6vw 2vw; }
body.ig-mode .tip-ttl    { font-size:1.6vw; letter-spacing:.5vw; margin-bottom:.8vw; font-weight:300; }
body.ig-mode .tip-body   { font-size:2.8vw; line-height:1.7; font-family:'Cormorant Garamond',serif; font-style:italic; }

/* — FOOTER — */
body.ig-mode .ftr        { padding:1.6vw 6vw; background:#0d0d0d; }
body.ig-mode .ftr-main   { font-size:1.6vw; letter-spacing:.4vw; font-weight:300; color:rgba(255,255,255,.6); }
body.ig-mode .ftr-src    { font-size:2vw; letter-spacing:.2vw; font-weight:400; color:var(--c-accent); text-align:right; display:block !important; }
.btn {
  padding:11px 22px; border:none; border-radius:24px;
  font-size:13px; font-weight:bold; cursor:pointer; letter-spacing:.4px;
  -webkit-tap-highlight-color:transparent; transition:opacity .2s;
}
.btn:active { opacity:.75; }
.btn-jpg { background:#1a1a1a; color:#fff; }
.btn-pdf { background:#cc0000; color:#fff; }
.btn-theme {
  background:none; border:2px solid var(--bd-card);
  color:var(--c-primary); font-size:18px;
  padding:8px 14px; border-radius:24px; cursor:pointer;
  transition:border-color .3s, color .3s;
  -webkit-tap-highlight-color:transparent;
}

/* ── MODAL (bottom sheet) ── */
.modal-ov {
  position:fixed; inset:0;
  background:rgba(0,0,0,.55);
  display:flex; align-items:flex-end; justify-content:center;
  z-index:999; padding:0;
  animation:fadeIn .18s ease;
}
@keyframes fadeIn { from{opacity:0} to{opacity:1} }

.modal-crd {
  background:var(--bg-card);
  border-radius:18px 18px 0 0;
  width:min(100vw, 460px); max-width:100%;
  max-height:90vh; overflow-y:auto;
  box-shadow:0 -8px 40px rgba(0,0,0,.35);
  animation:slideUp .25s ease;
  transition:background .3s;
}
@keyframes slideUp { from{transform:translateY(30px);opacity:0} to{transform:translateY(0);opacity:1} }

.modal-hd {
  background:var(--bg-hdr);
  padding:14px 18px 13px; border-radius:18px 18px 0 0;
  display:flex; align-items:flex-start; justify-content:space-between;
  position:sticky; top:0; z-index:1;
}
.modal-hd-left  { display:flex; flex-direction:column; gap:3px; }
.modal-hd-bio   { display:flex; align-items:center; gap:6px; margin-bottom:3px; }
.modal-hd-type  { color:rgba(255,255,255,.48); font-size:9px; letter-spacing:2px; text-transform:uppercase; }
.modal-hd-n     { color:#fff; font-size:21px; font-weight:bold; line-height:1; }
.modal-hd-c     { color:rgba(255,255,255,.42); font-size:10px; font-style:italic; }
.modal-close    { background:none; border:none; color:rgba(255,255,255,.5); font-size:26px; cursor:pointer; padding:0 2px; line-height:1; flex-shrink:0; margin-top:-2px; }
.modal-close:hover { color:#fff; }

.modal-bd { padding:14px 18px 28px; }
.modal-sect { margin-bottom:12px; }
.modal-sect-ttl {
  font-size:8px; color:var(--c-primary); letter-spacing:2px; text-transform:uppercase;
  font-weight:bold; border-bottom:1px solid var(--c-divider);
  padding-bottom:4px; margin-bottom:8px;
}
.mrow { display:flex; gap:10px; align-items:baseline; padding:3px 0; }
.mkey { font-size:9px; color:var(--c-muted); letter-spacing:1px; text-transform:uppercase; min-width:80px; flex-shrink:0; }
.mval { font-size:12px; color:var(--c-primary); line-height:1.55; }
.mval.green { color:var(--c-primary); font-weight:bold; }
.mval.red   { color:var(--c-accent); }
.modal-nota {
  margin-top:12px; padding:10px 14px;
  background:var(--bg-moon); border-radius:8px;
  font-size:11.5px; color:var(--c-tip); font-style:italic; line-height:1.65;
  border-left:3px solid var(--c-accent);
}
.modal-nota::before { content:'💡 '; }
</style>
</head>
<body>

<div id="card"></div>

<div class="controls">
  <button class="btn btn-jpg" onclick="exportJPG()">📸 JPG</button>
  <button class="btn btn-pdf" onclick="exportPDF()">📄 PDF</button>
  <button class="btn btn-jpg" onclick="goToday()" style="background:#555">📅 Hoy</button>
  <button class="btn btn-theme" id="themeBtn" onclick="toggleTheme()">🌙</button>
</div>

// ── MOON PHASE ───────────────────────────────────────────────────────────────
function moonPhase(date) {
  const ref=new Date('2000-01-06T18:14:00Z'), SYN=29.530589;
  const c=(((date-ref)/86400000)%SYN+SYN)%SYN;
  const ill=Math.round(50*(1-Math.cos(2*Math.PI*c/SYN)));
  let ph,em;
  if(c<1.85)       {ph='Luna Nueva';       em='🌑';}
  else if(c<7.38)  {ph='Luna Creciente';   em='🌒';}
  else if(c<9.22)  {ph='Cuarto Creciente'; em='🌓';}
  else if(c<14.77) {ph='Gibosa Creciente'; em='🌔';}
  else if(c<16.61) {ph='Luna Llena';       em='🌕';}
  else if(c<22.15) {ph='Gibosa Menguante'; em='🌖';}
  else if(c<23.99) {ph='Cuarto Menguante'; em='🌗';}
  else             {ph='Luna Menguante';   em='🌘';}
  return {ph,em,ill,day:Math.round(c)};
}

// ── SIGN ALGORITHM (fallback) ────────────────────────────────────────────────
function moonSign(date){
  const d=(date-new Date('2000-01-01T12:00:00Z'))/86400000;
  const L=(((218.3165+13.17639648*d)%360)+360)%360;
  const Ls=((L-23.85)%360+360)%360;
  const SG=['Aries','Tauro','Géminis','Cáncer','Leo','Virgo',
            'Libra','Escorpio','Sagitario','Capricornio','Acuario','Piscis'];
  const BT={Aries:'fruto',Tauro:'raiz','Géminis':'flor','Cáncer':'hoja',
            Leo:'fruto',Virgo:'raiz',Libra:'flor',Escorpio:'hoja',
            Sagitario:'fruto',Capricornio:'raiz',Acuario:'flor',Piscis:'hoja'};
  const s=SG[Math.floor(Ls/30)];
  return {sign:s,tipo:BT[s]};
}

// ── RENDER CROPS (linked) ────────────────────────────────────────────────────
function renderCrops(arr, nota){
  if(!arr || arr.length===0){
    return nota ? `<em style="color:#aaa;font-size:9.5px">${nota}</em>` : '<span style="color:#aaa">—</span>';
  }
  const parts = arr.map(k => {
    if(FICHAS[k]){
      return `<span class="crop-link" onclick="showFicha('${k}')">${FICHAS[k].n}</span>`;
    }
    return `<span style="font-style:italic;color:#888;font-size:9.5px">${k}</span>`;
  });
  const html = parts.join(', ');
  return nota ? html + ` <em style="color:#aaa;font-size:9px">(${nota})</em>` : html;
}

// ── SELECT DAY ───────────────────────────────────────────────────────────────
function selectDay(y,m,d){
  pickedDate=new Date(y,m,d);
  render(pickedDate);
}
function goToday(){
  pickedDate=new Date();
  render(pickedDate);
}
function prevMonth(){
  pickedDate=new Date(pickedDate.getFullYear(),pickedDate.getMonth()-1,1);
  render(pickedDate);
}
function nextMonth(){
  pickedDate=new Date(pickedDate.getFullYear(),pickedDate.getMonth()+1,1);
  render(pickedDate);
}

// ── MINI CALENDAR ────────────────────────────────────────────────────────────
function miniCal(year,month,pickedDay,todayRef){
  const first=new Date(year,month,1).getDay();
  const days=new Date(year,month+1,0).getDate();
  const todayD=(todayRef.getFullYear()===year&&todayRef.getMonth()===month)?todayRef.getDate():-1;

  let rows='<tr>',cnt=0;
  for(let i=0;i<first;i++){rows+='<td></td>';cnt++;}
  for(let d=1;d<=days;d++){
    const tipo=getDayType(year,month,d);
    const col=tipo?TC_COL[tipo]:'#666';
    const isToday=(d===todayD);
    const isPicked=(d===pickedDay);
    let cls='dcell';
    let st='';
    if(isToday)  {cls+=' today';}
    else if(isPicked){cls+=' picked'; st=`color:${col};`;}
    else         {st=`color:${col};`;}
    rows+=`<td><span class="${cls}" style="${st}" onclick="selectDay(${year},${month},${d})">${d}</span></td>`;
    cnt++;
    if(cnt%7===0&&d<days) rows+='</tr><tr>';
  }
  while(cnt%7!==0){rows+='<td></td>';cnt++;}
  rows+='</tr>';

  return `<div class="cal-wrap">
    <div class="cal-ttl">${MESES[month].toUpperCase()} ${year}</div>
    <table class="cal-tbl">
      <thead><tr><th>D</th><th>L</th><th>M</th><th>M</th><th>J</th><th>V</th><th>S</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
}

// Tipo de día para el mini calendario (calculado on-the-fly por el algoritmo sidéreo)
function getDayType(year, month, day){
  const d = new Date(year, month, day, 12, 0, 0);
  return moonSign(d).tipo;
}

    Sagitario:  'Luna en Sagitario (Fuego 🔥). Día de Frutos expansivo. Excelente para secar semillas y cosechar. La energía es expansiva y cálida, ideal para frutos con mucho aroma.',
    Capricornio:'Luna en Capricornio (Tierra 🌍). Día de Raíces muy favorable. Trasplantar bulbos, cosechar raíces y abonar con compost. Energía densa y nutritiva para el suelo.',

    ({tipo,signo,vent,tip}=aabdaMes[day]);
  } else {
    const a=moonSign(date);
    signo=a.sign; tipo=a.tipo; vent='todo el día';
    tip=(TIPS[signo]||`Luna en ${signo}. ${TC[tipo]?.lbl||tipo}.`)
      +' · Consultar AABDA para horas exactas de transición.';

  const sea=SEASONAL[monNum]||SEASONAL[5];
