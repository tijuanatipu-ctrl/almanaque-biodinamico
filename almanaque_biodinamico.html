<title>Almanaque Biodinámico Hemisferio Sur</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }

/* ── VARIABLES CLARO / OSCURO ── */
:root {
  --bg-page:    #ebebeb;
  --bg-card:    #ffffff;
  --bd-card:    #1a1a1a;
  --bg-hdr:     #1a1a1a;
  --bg-nav:     #ec008c;
  --bg-moon:    #faf5f8;
  --bd-moon:    rgba(236,0,140,.12);
  --bg-cal:     #faf5f8;
  --bd-cal:     rgba(236,0,140,.1);
  --bg-ftr:     #1a1a1a;
  --c-primary:  #1a1a1a;
  --c-secondary:#444444;
  --c-muted:    #999999;
  --c-dim:      #cccccc;
  --c-accent:   #ec008c;
  --c-divider:  rgba(0,0,0,.12);
  --c-tip:      #2a2a2a;
  --c-tipline:  #e8e0e5;
  --c-picked-bg:#1a1a1a;
  --c-picked-fg:#ffffff;
  --shadow:     0 8px 48px rgba(0,0,0,.18);
}
body.dark {
  --bg-page:    #111111;
  --bg-card:    #1c1c1e;
  --bd-card:    #3a3a3a;
  --bg-hdr:     #0d0d0d;
  --bg-nav:     #970060;
  --bg-moon:    #26202a;
  --bd-moon:    rgba(236,0,140,.15);
  --bg-cal:     #211e24;
  --bd-cal:     rgba(255,255,255,.08);
  --bg-ftr:     #0d0d0d;
  --c-primary:  #e8e8e8;
  --c-secondary:#aaaaaa;
  --c-muted:    #555555;
  --c-dim:      #3a3a3a;
  --c-accent:   #ec008c;
  --c-divider:  rgba(255,255,255,.1);
  --c-tip:      #c0b0ba;
  --c-tipline:  #2e222a;
  --c-picked-bg:#e8e8e8;
  --c-picked-fg:#1a1a1a;
  --shadow:     0 8px 40px rgba(0,0,0,.6);
}

body {
  min-height:100vh;
  background:var(--bg-page);
  display:flex; flex-direction:column; align-items:center;
  padding:20px 0 36px;
  font-family:'Josefin Sans', 'Georgia', sans-serif;
  user-select:none;
  transition:background .3s;
}

/* ── CARD ── */
#card {
  width:min(100vw, 420px);
  background:var(--bg-card);
  display:flex; flex-direction:column;
  box-shadow:var(--shadow);
  overflow:hidden; position:relative;
  border-left:1.5px solid var(--bd-card);
  border-right:1.5px solid var(--bd-card);
  border-bottom:1.5px solid var(--bd-card);
  transition:background .3s, border-color .3s;
}
#card::before {
  content:''; position:absolute;
  top:0; left:0; right:0; height:3px;
  background:var(--c-accent); z-index:10;
}

/* HEADER */
.hdr {
  background:var(--bg-hdr);
  padding:12px 18px 11px;
  display:flex; align-items:center; justify-content:space-between;
  flex-shrink:0; margin-top:3px;
  transition:background .3s;
}
.hdr-name   { color:#fff; font-size:clamp(10px,2.9vw,12px); font-weight:400; letter-spacing:3px; text-transform:uppercase; font-family:'Oswald', sans-serif; }
.hdr-sub    { color:rgba(255,255,255,.38); font-size:clamp(7px,2vw,8.5px); letter-spacing:2px; margin-top:2px; font-family:'Josefin Sans', sans-serif; font-weight:300; }
.hdr-right  { display:flex; align-items:center; gap:8px; }
.hdr-icon   { font-size:clamp(18px,5.5vw,24px); }
.hdr-season { color:#fff; font-size:clamp(9px,2.6vw,11px); letter-spacing:.5px; text-align:right; line-height:1.5; }
.hdr-season span { color:rgba(255,255,255,.4); font-size:clamp(6px,1.9vw,8px); cursor:pointer; border-bottom:1px dotted rgba(255,255,255,.2); transition:color .2s; }
.hdr-season span:hover,.hdr-season span:active { color:rgba(255,255,255,.8); }

/* MONTH NAV */
.month-nav {
  display:flex; align-items:center; justify-content:space-between;
  padding:5px 14px; background:var(--bg-nav); flex-shrink:0;
  transition:background .3s;
}
.mnav-btn {
  background:none; border:none; color:#fff; font-size:22px;
  cursor:pointer; padding:0 8px; opacity:.85; line-height:1;
  -webkit-tap-highlight-color:transparent;
}
.mnav-btn:active { opacity:.5; }
.mnav-center { text-align:center; }
.mnav-label { display:block; color:#fff; font-size:clamp(11px,3.1vw,14px); font-weight:700; letter-spacing:3px; text-transform:uppercase; font-family:'Oswald', sans-serif; line-height:1.2; }
.mnav-day   { display:block; color:rgba(255,255,255,.65); font-size:clamp(8px,2.2vw,10px); font-weight:300; letter-spacing:3px; text-transform:uppercase; font-family:'Josefin Sans', sans-serif; margin-top:1px; }

/* DATE */
.date-wrap { text-align:center; padding:6px 18px 2px; flex-shrink:0; }
.date-num { font-size:clamp(72px,24vw,108px); font-weight:700; color:var(--c-accent); line-height:.9; font-family:'Oswald', 'Arial Black', sans-serif; font-style:normal; letter-spacing:-2px; }

/* HOY BADGE */
.mnav-hoy {
  display:inline-block; background:rgba(255,255,255,.18); border:none;
  color:#fff; font-size:8px; font-family:'Josefin Sans',sans-serif; font-weight:600;
  letter-spacing:1.5px; text-transform:uppercase; padding:2px 7px; border-radius:20px;
  cursor:pointer; margin-top:2px; -webkit-tap-highlight-color:transparent;
  transition:background .2s;
}
.mnav-hoy:active { background:rgba(255,255,255,.35); }

/* DIVIDERS */
.div-line {
  height:1px;
  background:linear-gradient(to right,transparent,var(--c-divider),transparent);
  margin:5px 22px; flex-shrink:0;
}

/* BIO TYPE */
.bio-wrap {
  display:flex; align-items:center; justify-content:center;
  gap:10px; padding:8px 18px 4px; flex-shrink:0;
}
.bio-icon { font-size:clamp(22px,7vw,30px); line-height:1; }
.bio-info  { display:flex; flex-direction:column; align-items:center; gap:2px; }
.bio-lbl   { font-size:clamp(14px,4vw,18px); font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--c-primary); font-family:'Oswald', sans-serif; font-style:normal; }
.bio-vent  { font-size:clamp(9px,2.6vw,11px); color:var(--c-muted); font-family:'Josefin Sans',sans-serif; font-weight:400; letter-spacing:.3px; }
.bio-arrow { font-size:clamp(16px,5vw,22px); color:var(--c-muted); font-weight:400; line-height:1; display:flex; flex-direction:column; align-items:center; gap:2px; font-family:'Oswald', sans-serif; }
.bio-trans-hora { font-size:clamp(8px,2.4vw,10px); color:var(--c-muted); font-weight:300; letter-spacing:.5px; line-height:1; font-family:'Josefin Sans', sans-serif; }
.bio-trans-lbl { text-align:center; font-size:clamp(11px,3vw,14px); font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--c-primary); padding:0 18px 2px; font-family:'Oswald', sans-serif; font-style:normal; }
.win-wrap  { display:none; }

/* MOON */
.moon-wrap {
  display:flex; align-items:center; gap:12px;
  padding:9px 14px; margin:2px 16px;
  border-radius:8px; background:var(--bg-moon);
  flex-shrink:0; border:1px solid var(--bd-moon);
  transition:background .3s, border-color .3s;
}
.moon-em  { font-size:24px; }
.moon-txt { font-size:12.5px; color:var(--c-secondary); line-height:1.7; font-family:'Josefin Sans', sans-serif; font-weight:400; }
.moon-sign{ font-weight:700; color:var(--c-primary); font-family:'Oswald', sans-serif; font-style:normal; font-size:14px; letter-spacing:.5px; }
.moon-bar { display:inline-block; width:36px; height:3px; border-radius:2px; background:var(--c-dim); vertical-align:middle; position:relative; margin:0 4px 1px; }
.moon-bar::after { content:''; position:absolute; left:0; top:0; height:100%; width:var(--p,50%); background:var(--c-accent); border-radius:2px; }
.moon-asc-ctx { font-size:12px; letter-spacing:.5px; font-weight:700; font-family:'Oswald', sans-serif; }
.moon-asc-ctx.asc  { color:#5a8a40; }
.moon-asc-ctx.desc { color:#1a7a9a; }

/* ASTRO TIMES */
.astro-wrap { padding:5px 18px 2px; flex-shrink:0; display:flex; align-items:center; gap:10px; font-family:'Josefin Sans',sans-serif; flex-wrap:wrap; }
.astro-grp  { display:flex; align-items:center; gap:4px; }
.astro-icon { font-size:13px; }
.astro-val  { font-size:13px; font-weight:700; color:var(--c-primary); font-family:'Oswald',sans-serif; }
.astro-sep  { color:var(--c-dim); font-size:10px; margin:0 1px; }
.astro-div  { color:var(--c-dim); font-size:14px; }

/* WINDOW */
.win-wrap { text-align:center; padding:5px 18px 2px; flex-shrink:0; }
.win-lbl  { font-size:8px; color:var(--c-muted); letter-spacing:2px; text-transform:uppercase; margin-bottom:2px; font-family:'Josefin Sans', sans-serif; font-weight:300; }
.win-val  { font-size:15px; font-weight:700; color:var(--c-accent); font-family:'Oswald', sans-serif; letter-spacing:1px; }

/* CALENDAR LEGEND */
.cal-legend { display:flex; flex-wrap:wrap; justify-content:center; gap:2px 7px; margin-top:4px; font-size:7px; color:var(--c-muted); letter-spacing:.8px; text-transform:uppercase; font-family:'Josefin Sans', sans-serif; font-weight:300; }
.cal-legend span { display:flex; align-items:center; gap:2px; }
.leg-sq { display:inline-block; width:7px; height:7px; border-radius:1px; }
.leg-tr { display:inline-block; width:10px; height:2px; background:rgba(60,140,40,.6); border-radius:1px; vertical-align:middle; }

/* SEASONAL CROPS */
.crops-wrap { padding:4px 18px 8px; flex-shrink:0; }
.crops-ttl  { font-size:8px; color:var(--c-muted); letter-spacing:2px; text-transform:uppercase;
              margin-bottom:4px; display:flex; align-items:center; gap:7px;
              font-family:'Josefin Sans',sans-serif; font-weight:300; }
.crops-ttl::after { content:''; flex:1; height:1px; background:var(--c-tipline); }
.crops-val  { font-size:13px; color:var(--c-primary); line-height:1.65; font-family:'Josefin Sans',sans-serif; font-weight:400; }
.crops-nota { font-size:10px; color:var(--c-muted); margin-top:2px; font-family:'Josefin Sans',sans-serif; font-style:italic; }

.crop-link {
  cursor:pointer; color:var(--c-primary);
  border-bottom:1px dotted var(--c-accent);
  font-style:normal; transition:color .15s;
}
.crop-link:hover { color:var(--c-accent); }

/* RAYADOS */
.rayado-wrap {
  margin:0 16px 4px; padding:7px 12px; border-radius:6px; flex-shrink:0;
  background:rgba(150,80,0,.08); border-left:3px solid #c06000;
}
body.dark .rayado-wrap { background:rgba(200,120,0,.12); }
.rayado-ttl { font-size:11px; font-weight:700; color:#c06000; font-family:'Oswald',sans-serif; letter-spacing:.5px; }
.rayado-sub { font-size:10.5px; color:var(--c-secondary); font-family:'Josefin Sans',sans-serif; font-weight:300; margin-top:2px; }
.dcell.rayado::after {
  content:''; position:absolute; left:3px; right:3px; top:50%; height:1.5px;
  background:rgba(180,100,0,.6); border-radius:1px; pointer-events:none;
}
.dcell.rayado { position:relative; }
.mes-cell.rayado-dia { background:rgba(150,80,0,.05) !important; }
.mes-cell.rayado-dia .mes-dnum { color:#b05000; }
.mes-rayado { font-size:6px; color:#b05000; font-family:'Josefin Sans',sans-serif; line-height:1; }

/* TIP */
.tip-wrap { padding:4px 18px 10px; flex-shrink:0; }
.tip-ttl  {
  font-size:9px; color:var(--c-muted); letter-spacing:2.5px; text-transform:uppercase;
  margin-bottom:6px; display:flex; align-items:center; gap:7px;
  font-family:'Oswald', sans-serif; font-weight:400;
}
.tip-ttl::after { content:''; flex:1; height:1px; background:var(--c-tipline); }
.tip-body { font-size:13px; color:var(--c-tip); line-height:1.7; font-style:normal; font-family:'Josefin Sans', sans-serif; font-weight:400; }
.tip-body + .tip-body { margin-top:8px; color:var(--c-secondary); font-size:12.5px; }

/* MINI CALENDAR */
.cal-wrap {
  margin:0 12px 6px;
  border:1px solid var(--bd-cal); border-radius:6px;
  padding:4px 7px 5px; background:var(--bg-cal); flex-shrink:0;
  transition:background .3s, border-color .3s;
}
.cal-tbl { width:100%; border-collapse:collapse; }
.cal-tbl th{ font-size:8px; color:var(--c-muted); text-align:center; padding:1px 0 3px; font-weight:300; letter-spacing:.5px; font-family:'Josefin Sans', sans-serif; }
.cal-tbl td{ text-align:center; padding:0; }
.cal-tbl td.tras { border-bottom:2px solid rgba(60,140,40,.55); }
.dcell {
  display:inline-flex; align-items:center; justify-content:center;
  width:23px; height:18px; border-radius:4px;
  font-size:10px; font-weight:700; color:var(--c-primary);
  cursor:pointer; transition:opacity .15s;
  -webkit-tap-highlight-color:transparent;
  font-family:'Josefin Sans', sans-serif;
}
.dcell:active { opacity:.4; }
.dcell.today  { background:var(--c-accent); color:#fff; font-weight:bold; }
.dcell.picked { background:var(--c-picked-bg); color:var(--c-picked-fg); font-weight:bold; }
.dcell.trans  { height:24px; flex-direction:column; gap:0; justify-content:flex-start; padding-top:2px; }
.trans-dots   { display:flex; align-items:center; gap:1px; font-size:5px; line-height:1; margin-top:1px; }
.trans-dots .tarr { color:var(--c-muted); font-size:4px; }


/* FOOTER */
.ftr {
  background:var(--bg-ftr);
  padding:9px 18px;
  display:flex; align-items:center; justify-content:space-between;
  flex-shrink:0; transition:background .3s;
}
.ftr-main { color:rgba(255,255,255,.65); font-size:9.5px; letter-spacing:1.5px; font-family:'Josefin Sans', sans-serif; font-weight:300; text-transform:uppercase; }
.ftr-src  { color:rgba(255,255,255,.28); font-size:7px; letter-spacing:.5px; text-align:right; line-height:1.5; }

/* CONTROLS (below card) */
.controls {
  display:flex; gap:10px; margin-top:18px;
  justify-content:center; padding:0 16px; flex-wrap:wrap;
}

/* ══════════════════════════════════════════════════
   IG SCREENSHOT MODE — ?ig=1  (1000×1250 → 1080×1350)
   ══════════════════════════════════════════════════ */
body.ig-mode {
  padding:0 !important;
  background:var(--ig-bg,#1a1a1a) !important;
  min-height:100vh;
  justify-content:flex-start;
  --c-accent:    #ec008c;
  --c-primary:   #f0f0f0;
  --c-secondary: #e0e0e0;
  --c-muted:     #bbbbbb;
  --bg-nav:      #ec008c;
  --bg-hdr:      #0d0d0d;
  --bg-card:     #1a1a1a;
  --bd-card:     #1a1a1a;
  --bg-moon:     #252525;
  --bd-moon:     rgba(236,0,140,.2);
  --c-divider:   rgba(255,255,255,.1);
  --c-tip:       #e0e0e0;
  --c-tipline:   #444444;
}
body.ig-mode #card {
  width:100vw !important;
  max-width:100vw !important;
  min-height:100vh !important;
  box-shadow:none !important;
  border:none !important;
  display:flex; flex-direction:column;
  justify-content:space-between;
}
body.ig-mode .controls { display:none !important; }
body.ig-mode .cal-wrap  { display:none !important; }

/* — TIPOGRAFÍA IG — */
body.ig-mode { font-family:'Josefin Sans', sans-serif !important; }
body.ig-mode .date-num,
body.ig-mode .bio-lbl    { font-family:'Oswald', sans-serif !important; }
body.ig-mode .hdr-name,
body.ig-mode .mnav-label { font-family:'Oswald', sans-serif !important; }

/* — HEADER — */
body.ig-mode .hdr        { padding:1vw 6vw; background:#1a1a1a !important; border-bottom:1px solid rgba(255,255,255,.06); }
body.ig-mode .hdr-name   { font-size:1.8vw; letter-spacing:.25vw; font-weight:300; }
body.ig-mode .hdr-sub    { display:none; }
body.ig-mode .hdr-season { font-size:1.8vw; line-height:1.4; font-family:'Josefin Sans',sans-serif; font-weight:300; }
body.ig-mode .hdr-icon   { font-size:2.2vw; }

/* — MONTH NAV — */
body.ig-mode .month-nav  { padding:1.2vw 6vw; }
body.ig-mode .mnav-label { font-size:3.2vw; letter-spacing:.8vw; font-weight:400; }
body.ig-mode .mnav-btn   { opacity:0; pointer-events:none; }

/* — DATE — */
body.ig-mode .date-wrap  { padding:.3vw 6vw 0; }
body.ig-mode .mnav-day   { font-size:2vw; letter-spacing:1.5vw; font-weight:300; }
body.ig-mode .date-num   { font-size:17vw; line-height:.88; font-weight:900; }

/* — BIO TYPE (DÍA DE RAÍCES) — */
body.ig-mode .bio-wrap   { padding:1vw 6vw; gap:1.8vw; }
body.ig-mode .bio-icon   { font-size:4.5vw; }
body.ig-mode .bio-lbl    { font-size:4.2vw; letter-spacing:.2vw; font-weight:700; font-style:italic; }

/* — MOON — */
body.ig-mode .moon-wrap  { margin:0 5vw; padding:1.8vw 4vw; }
body.ig-mode .moon-em    { font-size:4.2vw; }
body.ig-mode .moon-txt   { font-size:2.8vw; line-height:1.5; font-weight:300; color:var(--c-secondary); }
body.ig-mode .moon-sign  { font-size:3.5vw; font-family:'Oswald',sans-serif; font-style:normal; font-weight:700; color:var(--c-primary); }
body.ig-mode .moon-asc-ctx { font-size:2.4vw; letter-spacing:.4vw; font-weight:600; color:var(--c-secondary); }

/* — PERÍODO FAVORABLE — */
body.ig-mode .win-wrap   { display:block; padding:1vw 6vw; }
body.ig-mode .win-lbl    { font-size:2vw; letter-spacing:.5vw; margin-bottom:.3vw; font-weight:300; }
body.ig-mode .win-val    { font-size:3.5vw; font-family:'Playfair Display',serif; font-weight:700; }

/* — SEMBRAR / COSECHAR — */
body.ig-mode .crops-wrap { padding:1vw 6vw; }
body.ig-mode .crops-ttl  { font-size:2vw; letter-spacing:.5vw; margin-bottom:.4vw; }
body.ig-mode .crops-val  { font-size:3vw; line-height:1.5; font-family:'Josefin Sans',sans-serif; }
body.ig-mode .crops-nota { font-size:2vw; }

/* — TIP DEL DÍA — */
body.ig-mode .tip-wrap   { padding:1vw 6vw 1vw; }
body.ig-mode .tip-ttl    { font-size:2vw; letter-spacing:.5vw; margin-bottom:.5vw; font-weight:300; }
body.ig-mode .tip-body   { font-size:3vw; line-height:1.55; font-family:'Cormorant Garamond',serif; font-style:italic; font-weight:600; color:var(--c-tip); }

/* — FOOTER — */
body.ig-mode .ftr        { padding:1vw 6vw; background:#1a1a1a !important; border-top:1px solid rgba(255,255,255,.06); }
body.ig-mode .ftr-main   { font-size:1.8vw; letter-spacing:.3vw; font-weight:300; color:rgba(255,255,255,.6); }
body.ig-mode .ftr-src    { font-size:2vw; letter-spacing:.15vw; font-weight:700; color:var(--c-accent); text-align:right; display:block !important; }

/* ── IG LIGHT MODE — illum > 0.5 ── */
body.ig-mode.ig-light {
  background:var(--ig-bg,#f0f0f0) !important;
  --c-accent:    #ec008c;
  --c-primary:   #0a0a0a;
  --c-secondary: #1a1a1a;
  --c-muted:     #333333;
  --bg-nav:      #ec008c;
  --bg-hdr:      #1a1a1a;
  --bg-card:     var(--ig-bg,#ffffff);
  --bg-moon:     var(--ig-moon,#f4f4f4);
  --bd-moon:     rgba(236,0,140,.15);
  --c-tip:       #111111;
  --c-tipline:   #cccccc;
}
body.ig-mode.ig-light #card   { background:var(--ig-bg,#ffffff); }
body.ig-mode.ig-light .moon-wrap { background:var(--ig-moon,#f4f4f4); border-color:rgba(236,0,140,.15); }
.btn {
  padding:11px 22px; border:none; border-radius:24px;
  font-size:13px; font-weight:bold; cursor:pointer; letter-spacing:.4px;
  -webkit-tap-highlight-color:transparent; transition:opacity .2s;
}
.btn:active { opacity:.75; }

.mes-nav button { background:none; border:none; color:#fff; font-size:22px; cursor:pointer; padding:0 8px; opacity:.85; }

.mes-grid { display:grid; grid-template-columns:repeat(7,1fr); flex:1; }
.mes-dh   {
  text-align:center; font-size:8px; font-family:'Josefin Sans',sans-serif;

.mes-cell {

.mes-cell:nth-child(7n) { border-right:none; }
.mes-cell:hover, .mes-cell:active { background:rgba(0,0,0,.04); }

.mes-cell.hoy .mes-dnum { color:var(--c-accent); font-weight:900; }
.mes-cell.vacio { cursor:default; background:var(--bg-cal); }
.mes-cell.tras  { border-bottom:3px solid rgba(60,140,40,.65); }

.mes-luna.desc { color:#1a7a9a; }

  position:fixed; inset:0;

function getEstacion(date) {
  const y = date.getFullYear();
  const T = (y - 2000) / 1000;
  function jd(jd0, a, b, c) { return new Date((jd0 + a*T + b*T*T + c*T*T*T - 2440587.5) * 86400000); }
  const mar = jd(2451623.80984, 365242.37404,  0.05169, -0.00411);
  const jun = jd(2451716.56767, 365241.62603,  0.00325,  0.00888);
  const sep = jd(2451810.21715, 365242.01767, -0.11575,  0.00337);
  const dec = jd(2451900.05952, 365242.74049, -0.06223, -0.00823);
  if (date >= mar && date < jun) return 'Otoño 🍂';
  if (date >= jun && date < sep) return 'Invierno ❄️';
  if (date >= sep && date < dec) return 'Primavera 🌸';
  return 'Verano ☀️';
}

// ── MOON PHASE ───────────────────────────────────────────────────────────────
function moonPhase(date) {
  const ref=new Date('2000-01-06T18:14:00Z'), SYN=29.530589;
  const c=(((date-ref)/86400000)%SYN+SYN)%SYN;
  const ill=Math.round(50*(1-Math.cos(2*Math.PI*c/SYN)));
  let ph,em;
  if(c<1.85)       {ph='Luna Nueva';       em='🌑';}
  else if(c<7.38)  {ph='Luna Creciente';   em='🌒';}
  else if(c<9.22)  {ph='Cuarto Creciente'; em='🌓';}
  else if(c<14.77) {ph='Gibosa Creciente'; em='🌔';}
  else if(c<16.61) {ph='Luna Llena';       em='🌕';}
  else if(c<22.15) {ph='Gibosa Menguante'; em='🌖';}
  else if(c<23.99) {ph='Cuarto Menguante'; em='🌗';}
  else             {ph='Luna Menguante';   em='🌘';}
  return {ph,em,ill,day:Math.round(c)};
}

// ── MOON ASCENDING / DESCENDING ──────────────────────────────────────────────
function moonAscending(date){
  const d=(date-new Date('2000-01-01T12:00:00Z'))/86400000;
  const L=(((218.316+13.176396*d)%360)+360)%360;
  // Hemisferio SUR (Argentina): la Luna está más alta cuando está en Cáncer–Sagitario
  // Ascendente (sube en cielo austral): Cáncer→Sagitario (90°≤L≤270°)
  // Descendente (baja en cielo austral): Capricornio→Géminis (L>270° o L<90°)
  // Período de trasplante AABDA = luna descendente = Capricornio→Géminis
  return L>=90 && L<=270;
}

// ── SIGN ALGORITHM (fallback) ────────────────────────────────────────────────
function moonSign(date){
  const d=(date-new Date('2000-01-01T12:00:00Z'))/86400000;
  const L=(((218.3165+13.17639648*d)%360)+360)%360;
  const Ls=((L-23.85)%360+360)%360;
  const SG=['Aries','Tauro','Géminis','Cáncer','Leo','Virgo',
            'Libra','Escorpio','Sagitario','Capricornio','Acuario','Piscis'];
  const BT={Aries:'fruto',Tauro:'raiz','Géminis':'flor','Cáncer':'hoja',
            Leo:'fruto',Virgo:'raiz',Libra:'flor',Escorpio:'hoja',
            Sagitario:'fruto',Capricornio:'raiz',Acuario:'flor',Piscis:'hoja'};
  const s=SG[Math.floor(Ls/30)];
  return {sign:s,tipo:BT[s]};
}

// ── MERGE CROPS (unifica p y h sin duplicados) ───────────────────────────────
function mergeCrops(sc){
  const seen=new Set(), all=[];
  [...(sc.p||[]),...(sc.h||[])].forEach(k=>{ if(!seen.has(k)){seen.add(k);all.push(k);} });
  return {crops:all, nota:sc.nota_p||sc.nota_h||null};
}

// ── RENDER CROPS (linked) ────────────────────────────────────────────────────
function renderCrops(arr, nota){
  if(!arr || arr.length===0){
    return nota ? `<em style="color:#aaa;font-size:9.5px">${nota}</em>` : '<span style="color:#aaa">—</span>';
  }
  const parts = arr.map(k => {
    if(FICHAS[k]){
      return `<span class="crop-link" onclick="showFicha('${k}')">${FICHAS[k].n}</span>`;
    }
    return `<span style="font-style:italic;color:#888;font-size:9.5px">${k}</span>`;
  });
  const html = parts.join(', ');
  return nota ? html + ` <em style="color:#aaa;font-size:9px">(${nota})</em>` : html;
}

}
function goToday(){
  pickedDate=new Date();
  render(pickedDate);
}
function prevMonth(){
  pickedDate=new Date(pickedDate.getFullYear(),pickedDate.getMonth()-1,1);
  render(pickedDate);
}
function nextMonth(){
  pickedDate=new Date(pickedDate.getFullYear(),pickedDate.getMonth()+1,1);
  render(pickedDate);
}
function prevDay(){
  const d=new Date(pickedDate); d.setDate(d.getDate()-1);
  pickedDate=d; render(pickedDate);
}
function nextDay(){
  const d=new Date(pickedDate); d.setDate(d.getDate()+1);
  pickedDate=d; render(pickedDate);
}

(function(){
  let tx=0, ty=0;
  const el=document.getElementById('card');
  el.addEventListener('touchstart',e=>{
    tx=e.touches[0].clientX;
    ty=e.touches[0].clientY;
  },{passive:true});
  el.addEventListener('touchend',e=>{
    const dx=e.changedTouches[0].clientX-tx;
    const dy=e.changedTouches[0].clientY-ty;
    if(Math.abs(dx)<50||Math.abs(dx)<Math.abs(dy)*1.5) return;
    dx<0 ? nextDay() : prevDay();
  },{passive:true});
})();

function openMesView(){
  mesViewMon=pickedDate.getMonth();
  mesViewYear=pickedDate.getFullYear();
  renderMesView();
}

function renderMesView(){
  document.getElementById('mes-modal')?.remove();
  const year=mesViewYear, mon=mesViewMon;
  const first=new Date(year,mon,1).getDay();
  const days=new Date(year,mon+1,0).getDate();
  const todayY=TODAY.getFullYear(), todayM=TODAY.getMonth(), todayD=TODAY.getDate();

  const DIAS_SHORT=['D','L','M','M','J','V','S'];
  let headers=DIAS_SHORT.map(d=>`<div class="mes-dh">${d}</div>`).join('');

  let cells='';
  for(let i=0;i<first;i++) cells+=`<div class="mes-cell vacio"></div>`;

  for(let d=1;d<=days;d++){
    const date=new Date(year,mon,d,12,0,0);
    const aabdaMes=year===2026?MESES_AABDA_2026[mon]:null;
    const dayData=aabdaMes?aabdaMes[d]:null;
    const tipo=dayData?dayData.tipo:moonSign(date).tipo;
    const signo=dayData?dayData.signo:moonSign(date).sign;
    const tc=TC[tipo]||TC.hoja;
    const trans=getTransicion(year,mon,d);
    const mp=moonPhase(date);
    const asc=moonAscending(date);
    const isTras=isDayTrasplante(year,mon,d);
    const isHoy=(year===todayY&&mon===todayM&&d===todayD);
    const rayDia=isRayado(dayData?dayData.tip:'');

    // Organ icon(s)
    let iconHtml=trans
      ?`<span class="mes-icon">${TC[trans.tipo1].icon}<span style="font-size:7px;color:var(--c-muted)">→</span>${tc.icon}</span>`
      :`<span class="mes-icon">${tc.icon}</span>`;

    // Transition time
    let transHtml=trans&&trans.hora
      ?`<span class="mes-trans">${trans.hora}</span>`:'';

    // Zodiac sign (clean, no @hs)
    let signoClean=(signo||'').replace(/@[\d\-–]+\s*hs/i,'').replace(/\s+$/,'');
    // Add glyphs
    signoClean=addGlyphs(signoClean);

    // Moon phase (only on phase days)
    let faseHtml=mp.day<=1||mp.day===8||mp.day===15||mp.day===22
      ?`<span class="mes-fase">${mp.em}</span>`:'';

    // Ascending/descending
    let lunaHtml=`<span class="mes-luna ${asc?'asc':'desc'}">${asc?'↑':'↓'}</span>`;

    cells+=`<div class="mes-cell${isHoy?' hoy':''}${isTras?' tras':''}${rayDia?' rayado-dia':''}" onclick="selectDay(${year},${mon},${d});closeMesView()">
      <span class="mes-dnum">${d}</span>
      ${iconHtml}${transHtml}
      <span class="mes-signo">${signoClean}</span>
      <div style="display:flex;gap:3px;align-items:center">${faseHtml}${lunaHtml}${rayDia?'<span class="mes-rayado">---</span>':''}</div>
    </div>`;
  }

  // Fill last row
  const total=first+days;
  const rem=total%7===0?0:7-(total%7);
  for(let i=0;i<rem;i++) cells+=`<div class="mes-cell vacio"></div>`;

  const el=document.createElement('div');
  el.id='mes-modal'; el.className='mes-ov';
  el.innerHTML=`
    <div class="mes-crd">
      <div class="mes-hdr">
        <span class="mes-titulo">Vista mensual</span>
        <button class="mes-close" onclick="closeMesView()">×</button>
      </div>
      <div class="mes-nav">
        <button onclick="mesViewMon--;if(mesViewMon<0){mesViewMon=11;mesViewYear--;}renderMesView()">&#8249;</button>
        <span>${MESES[mon].toUpperCase()} ${year}</span>
        <button onclick="mesViewMon++;if(mesViewMon>11){mesViewMon=0;mesViewYear++;}renderMesView()">&#8250;</button>
      </div>
      <div class="mes-grid">
        ${headers}${cells}
      </div>
      <div class="mes-legend">
        <div class="mes-legend-item"><span>🍎</span> Frutos</div>
        <div class="mes-legend-item"><span>🥕</span> Raíces</div>
        <div class="mes-legend-item"><span>🌼</span> Flores</div>
        <div class="mes-legend-item"><span>🌿</span> Hojas</div>
        <div class="mes-legend-item"><span class="mes-luna asc">↑</span> Ascendente</div>
        <div class="mes-legend-item"><span class="mes-luna desc">↓</span> Descendente</div>
        <div class="mes-legend-item"><span style="display:inline-block;width:14px;height:3px;background:rgba(60,140,40,.7);border-radius:1px;vertical-align:middle"></span> Trasplante</div>
        <div class="mes-legend-item"><span class="mes-rayado" style="font-size:8px">---</span> Restrictivo</div>
      </div>
    </div>`;
  el.addEventListener('click', e=>{ if(e.target===el) closeMesView(); });
  document.body.appendChild(el);
}

function closeMesView(){
  document.getElementById('mes-modal')?.remove();
}

function isDayTrasplante(year,month,day){
  if(year===2026 && TRAS_2026[month]){
    return TRAS_2026[month].some(([s,e])=>day>=s&&day<=e);
  }
  return !moonAscending(new Date(year,month,day,12,0,0));
}

function miniCal(year,month,pickedDay,todayRef){
  const first=new Date(year,month,1).getDay();
  const days=new Date(year,month+1,0).getDate();
  const todayD=(todayRef.getFullYear()===year&&todayRef.getMonth()===month)?todayRef.getDate():-1;

  let rows='<tr>',cnt=0;
  for(let i=0;i<first;i++){rows+='<td></td>';cnt++;}
  for(let d=1;d<=days;d++){
    const tipo=getDayType(year,month,d);
    const col=tipo?TC_COL[tipo]:'#666';
    const isToday=(d===todayD);
    const isPicked=(d===pickedDay);
    let cls='dcell';
    let st='';
    const trans=getTransicion(year,month,d);
    if(trans) cls+=' trans';
    const dayTip=(year===2026&&MESES_AABDA_2026[month]&&MESES_AABDA_2026[month][d])?MESES_AABDA_2026[month][d].tip:'';
    if(isRayado(dayTip)) cls+=' rayado';
    if(isToday)  {cls+=' today';}
    else if(isPicked){cls+=' picked'; st=`color:${col};`;}
    else         {st=`color:${col};`;}
    const tdCls=isDayTrasplante(year,month,d)?'tras':'';
    const dotsHtml=trans&&!isToday&&!isPicked
      ?`<span class="trans-dots"><span style="color:${TC_COL[trans.tipo1]}">●</span><span class="tarr">›</span><span style="color:${TC_COL[trans.tipo2]}">●</span></span>`
      :'';
    rows+=`<td class="${tdCls}"><span class="${cls}" style="${st}" onclick="selectDay(${year},${month},${d})">${d}${dotsHtml}</span></td>`;
    cnt++;
    if(cnt%7===0&&d<days) rows+='</tr><tr>';
  }
  while(cnt%7!==0){rows+='<td></td>';cnt++;}
  rows+='</tr>';

  return `<div class="cal-wrap">
    <table class="cal-tbl">
      <thead><tr><th>D</th><th>L</th><th>M</th><th>M</th><th>J</th><th>V</th><th>S</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="cal-legend">
      <span><span class="leg-sq" style="background:#cc0000"></span>Frutos</span>
      <span><span class="leg-sq" style="background:#7a5c3a"></span>Raíces</span>
      <span><span class="leg-sq" style="background:#8a70a0"></span>Flores</span>
      <span><span class="leg-sq" style="background:#3a7a50"></span>Hojas</span>
      <span><span class="leg-tr"></span>Trasplante</span>
    </div>
  </div>`;
}

// MAYO_2026 contiene datos del calendario 2023 (pendiente de corrección con 2026 real)
// Para activar datos precisos de un mes: descomentarlo y agregar la condición en render()

const MESES_AABDA_2026=[null,null,null,null,
  MAYO_2026,JUNIO_2026,JULIO_2026,AGOSTO_2026,SEPTIEMBRE_2026,
  OCTUBRE_2026,NOVIEMBRE_2026,DICIEMBRE_2026];

function getDayType(year, month, day){
  const mes=year===2026?MESES_AABDA_2026[month]:null;
  if(mes && mes[day]) return mes[day].tipo;
  const d=new Date(year,month,day,12,0,0);
  return moonSign(d).tipo;
}

function getTransicion(year, month, day){
  const mes=year===2026?MESES_AABDA_2026[month]:null;
  if(!mes || !mes[day]) return null;
  const {tipo, signo}=mes[day];
  const ai=signo.indexOf('→');
  if(ai===-1) return null;
  const s1=signo.slice(0,ai).trim();
  const tipo1=SIGN_TO_TIPO[s1];
  if(!tipo1||tipo1===tipo) return null;
  // Extraer hora de transición del signo: "@6-7hs" → "6–7 hs"
  const horaM=signo.match(/@([\d\-–]+)\s*hs/i);
  const hora=horaM ? horaM[1].replace('-','–')+' hs' : null;
  return {tipo1, tipo2:tipo, hora};
}

// ── RAYADOS — períodos desfavorables ─────────────────────────────────────────
function isRayado(tip){
  const t=(tip||'').toLowerCase();
  return t.includes('eclipse')||t.includes('perigeo')||
    (t.includes('nodo')&&(t.includes('ascendente de')||t.includes('descendente de')));
}
function getRayadoEvento(tip){
  const t=tip||'';
  const ecl=t.match(/eclipse\s+(?:total de sol|parcial de luna|de\s+\w+)/i);
  if(ecl) return ecl[0];
  const per=t.match(/perigeo\s*(?:lunar)?\s*@?[\d\-–]*\s*hs?/i);
  if(per) return per[0];
  const nod=t.match(/nodo\s+(?:ascendente|descendente)\s+(?:de\s+)?\w+/i);
  if(nod) return nod[0];
  return null;
}

// ── ZODIAC GLYPHS ─────────────────────────────────────────────────────────────
const ZODIAC_GLYPH={
  'Aries':'♈','Tauro':'♉','Géminis':'♊','Cáncer':'♋',
  'Leo':'♌','Virgo':'♍','Libra':'♎','Escorpio':'♏',
  'Sagitario':'♐','Capricornio':'♑','Acuario':'♒','Piscis':'♓'
};
function addGlyphs(s){
  return s.replace(/Aries|Tauro|Géminis|Cáncer|Leo|Virgo|Libra|Escorpio|Sagitario|Capricornio|Acuario|Piscis/g,
    m=>m+(ZODIAC_GLYPH[m]||''));
}
function fmtVent(v){
  if(!v) return v;
  const l=v.toLowerCase();
  if(l==='todo el día') return 'todo el día ✓';
  if(l==='restringido') return 'energía reducida ⚠';
  return v;
}
function fmtVentInline(v){
  if(!v) return '';
  const l=v.toLowerCase();
  if(l==='todo el día'||l==='todo el día ✓') return '';
  if(l==='restringido') return 'energía reducida ⚠';
  if(l.includes('desde las')) return v;
  if(l.includes('hasta las')) return v;
  if(l.includes('mejor')) return v;
  if(l.includes('desde transición')||l.includes('desde la transición')) return '';
  if(/^\d/.test(l)) return 'activo ' + v;
  return v;
}

function fmtHora(d){
  if(!d||isNaN(d.getTime())) return '--:--';
  return d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',hour12:false});
}

function getAstroTimes(date, lat, lon){
  const d=new Date(date.getFullYear(),date.getMonth(),date.getDate(),12,0,0);
  const sun=SunCalc.getTimes(d,lat,lon);
  const moon=SunCalc.getMoonTimes(d,lat,lon);
  return {
    salSol:  fmtHora(sun.sunrise),
    pueSol:  fmtHora(sun.sunset),
    salLuna: moon.alwaysUp?'↑ siempre': moon.alwaysDown?'—': moon.rise?fmtHora(moon.rise):'—',
    pueLuna: moon.alwaysUp?'—'        : moon.alwaysDown?'↓ no sale': moon.set ?fmtHora(moon.set) :'—',
  };
}

function requestGPS(){
  if(!navigator.geolocation){ alert('Tu dispositivo no soporta geolocalización'); return; }
  navigator.geolocation.getCurrentPosition(
    pos=>{
      const loc={lat:pos.coords.latitude, lon:pos.coords.longitude,
                 name:`${pos.coords.latitude.toFixed(2)}°, ${pos.coords.longitude.toFixed(2)}°`};
      fetch(`https://nominatim.openstreetmap.org/reverse?lat=${loc.lat}&lon=${loc.lon}&format=json&accept-language=es`)
        .then(r=>r.json())
        .then(d=>{
          const a=d.address||{};
          const city=a.city||a.town||a.village||a.municipality||a.county||'';
          const state=a.state||'';
          if(city) loc.name=city+(state?', '+state:'');
          localStorage.setItem('ubicacion',JSON.stringify(loc));
          userLoc=loc; render(pickedDate);
        })
        .catch(()=>{ localStorage.setItem('ubicacion',JSON.stringify(loc)); userLoc=loc; render(pickedDate); });
    },
    ()=>alert('No se pudo obtener la ubicación. Verificá los permisos.')
  );
}
function resetLoc(){
  userLoc=LOC_DEFAULT; localStorage.removeItem('ubicacion'); render(pickedDate);
}

// ── EXPORT ───────────────────────────────────────────────────────────────────
const _isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent);
const _isMobile=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

function _btnBusy(btn,busy,label){
  if(!btn) return;
  btn.disabled=busy;
  btn.textContent=busy?'⏳':label;
}

async function exportJPG(btn){
  _btnBusy(btn,true,'📸 JPG');
  try{
    const scale=_isMobile?2:2.67;
    const c=await html2canvas(document.getElementById('card'),
      {scale,useCORS:true,logging:false,backgroundColor:null});
    const d=pickedDate.toISOString().slice(0,10);
    const dataUrl=c.toDataURL('image/jpeg',.92);
    if(_isIOS){
      // iOS no soporta a.download — abrir en nueva pestaña para guardar/compartir
      const w=window.open('','_blank');
      if(w) w.document.write(`<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Almanaque ${d}</title></head><body style="margin:0;background:#111;display:flex;flex-direction:column;align-items:center;padding:16px;gap:12px"><p style="color:#ccc;font-family:sans-serif;font-size:13px;text-align:center;margin:0">Mantené presionada la imagen → <b>Guardar en Fotos</b></p><img src="${dataUrl}" style="max-width:100%;border-radius:8px"></body></html>`);
    } else {
      // Android + Desktop: blob URL download
      const res=await fetch(dataUrl);
      const blob=await res.blob();
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url; a.download=`almanaque-${d}.jpg`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url),3000);
    }
  } catch(e){ alert('Error al exportar imagen: '+e.message); }
  finally{ _btnBusy(btn,false,'📸 JPG'); }
}

async function exportPDF(btn){
  _btnBusy(btn,true,'📄 PDF');
  try{
    const scale=_isMobile?2:2.67;
    const c=await html2canvas(document.getElementById('card'),
      {scale,useCORS:true,logging:false,backgroundColor:null});
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF({orientation:'portrait',unit:'mm',format:[108,192]});
    pdf.addImage(c.toDataURL('image/jpeg',.92),'JPEG',0,0,108,192);
    const d=pickedDate.toISOString().slice(0,10);
    const blob=pdf.output('blob');
    const url=URL.createObjectURL(blob);
    if(_isIOS){
      // iOS: abrir en nueva pestaña (Safari muestra el PDF con opción de compartir)
      window.open(url,'_blank');
      setTimeout(()=>URL.revokeObjectURL(url),30000);
    } else {
      const a=document.createElement('a');
      a.href=url; a.download=`almanaque-${d}.pdf`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url),3000);
    }
  } catch(e){ alert('Error al exportar PDF: '+e.message); }
  finally{ _btnBusy(btn,false,'📄 PDF'); }
}

// ── THEME ────────────────────────────────────────────────────────────────────
function toggleTheme(){
  const dark=document.body.classList.toggle('dark');
  document.getElementById('themeBtn').textContent=dark?'☀️':'🌙';
  localStorage.setItem('theme',dark?'dark':'light');
}
(function(){
  const p=new URLSearchParams(location.search);
  if(p.get('ig')==='1'){
    document.body.classList.add('ig-mode');
    const illum=parseFloat(p.get('illum')||'0');
    const v =Math.round(17 +illum*228); // #111111 → #f5f5f5
    const mv=Math.round(37 +illum*198); // card luna: ligeramente offset
    document.documentElement.style.setProperty('--ig-bg',  `rgb(${v},${v},${v})`);
    document.documentElement.style.setProperty('--ig-moon',`rgb(${mv},${mv},${mv})`);
    if(illum>0.5) document.body.classList.add('ig-light');
  } else if(localStorage.getItem('theme')==='dark'){
    document.body.classList.add('dark');
    const b=document.getElementById('themeBtn');
    if(b) b.textContent='☀️';
  }
})();

const _igDate = new URLSearchParams(location.search).get('date');
if (_igDate) pickedDate = new Date(_igDate + 'T12:00:00');
render(pickedDate);

if(document.body.classList.contains('ig-mode')){
  const n=document.querySelector('.hdr-name');
  if(n) n.textContent='Calendario Biodinámico Argentino';
  const s=document.querySelector('.hdr-sub');
  if(s) s.style.display='none';
  const gp=document.querySelector('.hdr-season span');
  if(gp) gp.remove();
  const fm=document.querySelector('.ftr-main');
  if(fm) fm.textContent='';
  const fs=document.querySelector('.ftr-src');
  if(fs){ fs.style.display='block'; fs.innerHTML='App by&nbsp;<a href="https://www.instagram.com/tijuanatipu/" target="_blank" style="color:inherit;text-decoration:none;font-weight:700;">@tijuanatipu</a>'; }
}

}
